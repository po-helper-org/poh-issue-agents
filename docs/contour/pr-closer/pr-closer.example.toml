# Кладётся в корень обрабатываемого репозитория как .pr-closer.toml.
# Любой ключ можно опустить — значения по умолчанию заданы в shared/config.py.

# Команда прогона тестов. Не указана — включается автоопределение,
# не нашлось ничего — режим NO_TESTS с жёсткими границами.
test_command = "make test"
test_timeout = "20m"

# Лимит кругов правок и попыток на одно замечание.
max_rounds = 3
max_attempts = 2

# Сколько ждать ревью после push и ответа автора после эскалации.
review_timeout = "30m"
escalation_deadline = "72h"

# Порог совпадения наборов замечаний (коэффициент Жаккара).
# Точное равенство слишком строгое: одно новое замечание из пяти сбросило бы детектор.
loop_threshold = 0.8

# Бюджет патча относительный: абсолютное число бессмысленно, когда размер PR не нормирован.
diff_budget_ratio = 0.3
diff_budget_floor = 20
hunk_limit = 1

# soft — бюджет и hunk_limit только логируются; hard — по ним откатываем.
# Переключение вручную, после накопления замеров. См. scripts/calibrate.py.
enforcement = "soft"

# Дополнения к deny-list. Базовый список снять нельзя.
deny_paths = []

# Чьи замечания берутся в работу. Комментарии людей PR-Closer не чинит.
pr_agent_login = "pr-agent[bot]"
