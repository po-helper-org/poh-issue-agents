; Gitea харнесса БФТ: только 127.0.0.1, SQLite, без регистрации и внешних ресурсов (docs/BFT-HARNESS.md).
APP_NAME = Харнесс БФТ
RUN_MODE = prod
WORK_PATH = @BASE@/gitea

[server]
PROTOCOL = http
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 8650
ROOT_URL = http://127.0.0.1:8650/
DISABLE_SSH = true
OFFLINE_MODE = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = @BASE@/gitea/data/gitea.db
SQLITE_JOURNAL_MODE = WAL

[repository]
ROOT = @BASE@/gitea/repos
DEFAULT_PRIVATE = private

[indexer]
REPO_INDEXER_ENABLED = false
ISSUE_INDEXER_TYPE = db

[security]
INSTALL_LOCK = true
SECRET_KEY = @SECRET_KEY@
INTERNAL_TOKEN = @INTERNAL_TOKEN@
PASSWORD_HASH_ALGO = pbkdf2
; доставка веб-хуков только на локальный webhook харнесса (в 28.x — здесь, не в [webhook])
ALLOWED_HOST_LIST = loopback
; EGRESS_MODE = strict в 28.1 отказывает и loopback, и явному 127.0.0.1 (проверено на стенде T1) —
; оставлен режим по умолчанию: веб-хуки заводит только харнесс

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
DEFAULT_KEEP_EMAIL_PRIVATE = true

[mailer]
ENABLED = false

[webhook]
DELIVER_TIMEOUT = 10

[cron.update_checker]
ENABLED = false

[actions]
ENABLED = false

[log]
MODE = console
LEVEL = Warn
